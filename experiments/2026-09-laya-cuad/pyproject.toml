[project]
name = "jev-bench"
version = "0.1.0"
description = "Benchmark Laya vs a local SLM on CUAD clause detection (41 yes/no questions)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface_hub>=0.24",
    "pandas>=2.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Pulls in torch + transformers, so it's opt-in: `uv sync --extra laya`
laya = ["laya>=0.3.20"]

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
